<main class="container music-page">

<section class="hero">

    <div class="hero-content">

        <span class="badge">🎧 ECHO PLAYER</span>

        <h1>
            Discover
            <span>New Music</span>
        </h1>

        <p>

            Listen to your favorite artists,
            albums and playlists in one place.

        </p>

        <a href="#musicGrid" class="hero-btn">

            Browse Music

        </a>

    </div>

</section>

<section class="music-toolbar">

    <div class="search-box">

        <span>🔍</span>

        <input
        id="searchInput"
        type="text"
        placeholder="Search songs, artist or album">

    </div>

    <div class="filters">

        <button class="filter active">All</button>

        <button class="filter">Single</button>

        <button class="filter">Album</button>

        <button class="filter">Popular</button>

    </div>

</section>

<section>

<div id="musicGrid" class="music-grid">

<!-- JavaScript -->

</div>

</section>

</main>

<div class="player">

<div class="player-left">

<img id="playerCover"

src="assets/img/covers/song1.jpg">

<div>

<h3 id="playerTitle">

Choose a song

</h3>

<p id="playerArtist">

ECHO

</p>

</div>

</div>

<div class="player-center">

    <div class="player-controls">

        <button id="shuffleBtn">🔀</button>

        <button id="prevBtn">⏮</button>

        <button id="playBtn">▶</button>

        <button id="nextBtn">⏭</button>

        <button id="repeatBtn">🔁</button>

    </div>
    <div class="progress-wrapper">

    <span id="current">00:00</span>

    <div class="progress-bar" id="progressBar">

        <div id="progress"></div>

        <div id="progressThumb"></div>

    </div>

    <span id="durationPlayer">00:00</span>

</div>

</div>

<div class="player-right">

<div class="volume">

🔊

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1">

</div>

<div class="time">

<!-- <span id="current">00:00</span> -->



<!-- <span id="duration">00:00</span> -->
<!-- <span id="durationPlayer">00:00</span> -->

</div>

</div>

</div>
<aside class="playlist">

    <h2>Playlist</h2>

    <div id="playlist"></div>

</aside>
<audio id="audio"></audio>
