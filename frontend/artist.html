<section class="artist-banner">

<img id="artistImage">

OFFICIAL ARTIST

</span>

<h1 id="artistName">

Artist Name

</h1>

<p id="artistBio">

Biography...

</p>

<div class="artist-stats">

<div class="stat">

<h3 id="songsCount">

0

</h3>

<p>Songs</p>

</div>

</div>

</div>

<section class="artist-music">

<div class="section-title">

<h2>

</p>

</div>

<div id="artistSongs" class="music-grid">

</div>

<div class="player">

<div class="player-left">

<img id="playerCover"
src="assets/img/covers/song1.jpg">

<div>

<h3 id="playerTitle">

Choose a song

</h3>

<p id="playerArtist">

ECHO

</p>

</div>

</div>

<div class="player-center">

<div class="player-controls">

<button id="shuffleBtn">🔀</button>

<button id="prevBtn">⏮</button>

<button id="playBtn">▶</button>

<button id="nextBtn">⏭</button>

<button id="repeatBtn">🔁</button>

</div>

<div class="progress-bar" id="progressBar">

<div id="progress"></div>

</div>

</div>

<div class="player-right">

<div class="volume">

🔊

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1">

</div>

<div class="time">

<span id="current">00:00</span>

/

<span id="durationPlayer">00:00</span>

</div>

</div>

</div>

<aside class="playlist">

<h2>

Playlist

</h2>

<div id="playlist"></div>

</aside>
