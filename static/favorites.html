<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Favorites</title>

<!-- <link rel="stylesheet" href="/static/assets/css/style.css">
  -->

  <link rel="stylesheet" href="/static/assets/css/style.css">
<link rel="stylesheet" href="/static/assets/css/music.css">
<link rel="stylesheet" href="/static/assets/css/cards.css">
<link rel="stylesheet" href="/static/assets/css/player.css">
<link rel="stylesheet" href="/static/assets/css/responsive.css">
<link rel="stylesheet" href="/static/assets/css/animation.css">

</head>

<body>

<h1>❤️ Favorites</h1>

<div id="favoritesGrid" class="music-grid"></div>

<div class="player">

<div class="player-left">

<img id="playerCover"

src="/static/assets/img/covers/song1.jpg">

<div>

<h3 id="playerTitle">

Choose a song

</h3>

<p id="playerArtist">

ECHO

</p>

</div>

</div>

<div class="player-center">

<button id="shuffleBtn" title="Shuffle">🔀</button>

<button id="prevBtn">⏮</button>

<button id="playBtn">▶</button>

<button id="nextBtn">⏭</button>

<button id="repeatBtn" title="Repeat">🔁</button>

<div class="progress-bar" id="progressBar">

    <div id="progress"></div>

</div>

</div>

<div class="player-right">

<div class="volume">

🔊

<input
type="range"
id="volume"
min="0"
max="1"
step="0.01"
value="1">

</div>

<div class="time">

<span id="current">00:00</span>

/

<span id="duration">00:00</span>

</div>

</div>

</div>
<aside class="playlist">

    <h2>Playlist</h2>

    <div id="playlist"></div>

</aside>

<audio id="audio"></audio>
<script src="/static/assets/js/api.js"></script>
<script src="/static/assets/js/utils.js"></script>
<script src="/static/assets/js/player.js"></script>
<script src="/static/assets/js/favorites.js"></script>

</body>

</html>
